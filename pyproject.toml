[project]
name = "local-study-app"
version = "2.0.0"
description = "A private, local-first flashcard and study application with an MCP server."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.45; python_version >= '3.10'"]

[project.scripts]
local-study-mcp = "local_study_app.mcp_server:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
local_study_app = ["static/*"]
